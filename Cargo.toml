[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "LicenseRef-EasyLiDAR-Freeware"
rust-version = "1.90"

[workspace.dependencies]
rustlidar-core = { path = "crates/core" }
rustlidar-crs = { path = "crates/crs" }
laz = { version = "0.13", features = ["parallel"] }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw", "jpeg"] }
clap = { version = "4.6", features = ["derive"] }
delaunator = "1.1"
eframe = { version = "=0.36.2", features = ["glow"] }
rfd = "0.17.2"
shapefile = "0.9"
png = "0.18"
zune-jpeg = "0.5"
rayon = "1.12"
flate2 = "1.1"
earcutr = "0.5"
resvg = { version = "0.48", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
e57 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
# `!(x > 0.0)` is how parameters reject NaN as well as non-positive values.
neg_cmp_op_on_partial_ord = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
