[package]
name = "rustlidar-crs"
description = "Coordinate reference systems and reprojection (EPSG, WKT, PROJ strings, datum grids), with the Spanish datum grids built in"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wbprojection = "0.3.3"
geographiclib-rs = { version = "0.2.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff.workspace = true
ruzstd = "0.9"
rayon.workspace = true
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
