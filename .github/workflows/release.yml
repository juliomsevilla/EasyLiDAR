name: release
# Compila Windows, Linux y los dos macOS en GitHub y publica la release. Arranca solo al subir una
# etiqueta vX.Y.Z (git tag vX.Y.Z && git push origin vX.Y.Z), o a mano desde la pestaña Actions.
# Los paquetes también se pueden compilar en local (scripts/package.sh y package.ps1) y subir
# con --publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: ".exe" }
          - { os: ubuntu-22.04, name: linux-x64, ext: "" }
          - { os: macos-14, name: macos-arm64, ext: "" }
          - { os: macos-15-intel, name: macos-x64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for the window and file dialogs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          d=EasyLiDAR-${{ matrix.name }}
          mkdir "$d"
          cp target/release/easylidar${{ matrix.ext }} target/release/easylidar-gui${{ matrix.ext }} README.md LICENSE NOTICE THIRD_PARTY_LICENSES.md docs/MANUAL.md "$d"/
          cp -r licenses "$d"/
          # en macOS la app va en un .app (doble clic sin ventana de Terminal), igual que en scripts/package.sh
          if [ "$RUNNER_OS" = "macOS" ]; then
            chmod +x "$d"/easylidar "$d"/easylidar-gui
            scripts/macos-app.sh "$d" target/release/easylidar-gui
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$d.zip" "$d"; else tar czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLiDAR-${{ matrix.name }}
          path: EasyLiDAR-${{ matrix.name }}.*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
