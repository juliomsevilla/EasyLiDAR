name: linux
# El paquete de Linux lo compila GitHub: arranca solo cuando se crea la release vX.Y.Z (la crea
# scripts/package.sh --publish desde el Mac) y sube EasyLiDAR-linux-x64.tar.gz a esa misma
# release. También se puede lanzar a mano indicando la etiqueta (por ejemplo v0.1.4).
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a la que subir el paquete (por ejemplo v0.1.4)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for the window and file dialogs
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked
      - name: Package
        run: |
          d=EasyLiDAR-linux-x64
          mkdir "$d"
          cp target/release/easylidar target/release/easylidar-gui README.md LICENSE NOTICE THIRD_PARTY_LICENSES.md docs/MANUAL.md "$d"/
          cp -r licenses "$d"/
          chmod +x "$d"/easylidar "$d"/easylidar-gui
          tar czf "$d.tar.gz" "$d"
      - name: Upload to the release
        run: gh release upload "$TAG" EasyLiDAR-linux-x64.tar.gz --clobber
